<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Study</title>

  <!-- daisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- highlight.js : 코드 색상 표시 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>

<body>

  <!-- 전체 레이아웃 -->
  <div class="drawer lg:drawer-open">
    <input id="sidebar-toggle" type="checkbox" class="drawer-toggle">

    <!-- 본문 -->
    <div class="drawer-content">
      <header class="sticky top-0 z-10 flex items-center gap-3 border-b border-base-300 bg-base-100 px-4 py-3 lg:hidden">
        <label for="sidebar-toggle" class="btn btn-square btn-ghost">
          ☰
        </label>

        <div>
          <h1 class="text-lg font-bold">JS STUDY</h1>
          <p class="text-xs opacity-60">JavaScript Practice</p>
        </div>
      </header>

      <main class="p-4 md:p-8">
        <h2 id="title" class="text-3xl font-bold mb-6">JavaScript Study</h2>

        <!-- JS 파일 원본 코드 표시 -->
        <div id="view" class="card bg-base-100 shadow-sm">
          <div class="card-body p-4 md:p-6">
            사이드바에서 메뉴를 선택하세요.
          </div>
        </div>
      </main>
    </div>

    <!-- 사이드바 -->
    <div class="drawer-side">
      <label for="sidebar-toggle" class="drawer-overlay"></label>

      <aside id="sidebar" class="bg-base-200 min-h-full w-64">
        <div class="p-5">
          <h1 class="text-xl font-bold">JS STUDY</h1>
        </div>

        <ul class="menu w-full">
          <!-- ECMAScript -->
          <li class="menu-title">ECMAScript</li>
          <li><button data-file="ecmascript/01_ecmascript-overview.js">01. ECMAScript 개요</button></li>


          <!-- Web APIs -->
          <li class="menu-title mt-4">Web APIs</li>
          <li><button data-file="webapis/01_web-platform-basics.js">01. Web 플랫폼 기본</button></li>

            <!--Deep Dive -->
          <li class="menu-title mt-4">Deep Dive</li>
          <!-- <li><button data-file="deepdive/01_.js"></button>01. </li> -->

        </ul>
      </aside>
    </div>
  </div>

  <!-- 동적 JS 로딩 -->
  <script type="module" src="./main.js"></script>

</body>
</html>
