<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Study</title>

  <!-- daisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- highlight.js : 코드 색상 표시 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
</head>

<body>

  <!-- 전체 레이아웃 -->
  <div class="drawer lg:drawer-open">
    <input id="sidebar-toggle" type="checkbox" class="drawer-toggle">

    <!-- 본문 -->
    <div class="drawer-content">
      <header class="sticky top-0 z-10 flex items-center gap-3 border-b border-base-300 bg-base-100 px-4 py-3 lg:hidden">
        <label for="sidebar-toggle" class="btn btn-square btn-ghost">
          ☰
        </label>

        <div>
          <h1 class="text-lg font-bold">JS STUDY</h1>
          <p class="text-xs opacity-60">JavaScript Practice</p>
        </div>
      </header>

      <main class="p-4 md:p-8">
        <h2 id="title" class="text-3xl font-bold mb-6">JavaScript Study</h2>

        <!-- JS 파일 원본 코드 표시 -->
        <div id="view" class="card bg-base-100 shadow-sm">
          <div class="card-body p-4 md:p-6">
            사이드바에서 메뉴를 선택하세요.
          </div>
        </div>
      </main>
    </div>

    <!-- 사이드바 -->
    <div class="drawer-side">
      <label for="sidebar-toggle" class="drawer-overlay"></label>

      <aside id="sidebar" class="bg-base-200 min-h-full w-64">
        <div class="p-5">
          <h1 class="text-xl font-bold">JS STUDY</h1>
        </div>

        <ul class="menu w-full">
          <!-- ECMAScript -->
          <li class="menu-title">ECMAScript</li>
          <li><button data-file="ecmascript/01_ecmascript-overview.js">01. ECMAScript 개요</button></li>
          <li><button data-file="ecmascript/02_js-runtime-map.js">02. JavaScript 런타임 구조</button></li>
          <li><button data-file="ecmascript/03_values-types-mental-model.js">03. 값과 타입의 사고방식</button></li>
          <li><button data-file="ecmascript/04_syntax-and-strict-mode.js">04. 문법과 strict mode</button></li>
          <li><button data-file="ecmascript/05_coercion-and-abstract-operations.js">05. 타입 변환과 내부 연산</button></li>
          <li><button data-file="ecmascript/06_operators-and-short-circuit.js">06. 연산자와 단축 평가</button></li>

          <!-- Web APIs -->
          <li class="menu-title mt-4">Web APIs</li>
          <li><button data-file="webapis/01_web-platform-basics.js">01. Web 플랫폼 기본</button></li>
          <li><button data-file="webapis/02_api-design-patterns.js">02. Web API 설계 패턴 지도</button></li>
          <li><button data-file="webapis/02-1_abort-controller-idl.js">02-1. AbortController와 IDL</button></li>
          <li><button data-file="webapis/02-2_options-dictionary.js">02-2. 옵션 딕셔너리</button></li>
          <li><button data-file="webapis/02-3_interface-inheritance.js">02-3. 인터페이스 상속</button></li>
          <li><button data-file="webapis/02-4_event-listener-algorithm.js">02-4. 이벤트 리스너 규칙</button></li>
          <li><button data-file="webapis/02-5_feature-detection-and-spec-terms.js">02-5. 기능 탐지와 스펙 용어</button></li>
          <li><button data-file="webapis/02-6_crypto-and-binary-data.js">02-6. crypto와 바이트 데이터</button></li>
          <li><button data-file="webapis/03_rendering-pipeline.js">03. 렌더링 파이프라인</button></li>

            <!--Deep Dive -->
          <li class="menu-title mt-4">Deep Dive</li>
          <!-- <li><button data-file="deepdive/01_.js"></button>01. </li> -->

        </ul>
      </aside>
    </div>
  </div>

  <!-- 동적 JS 로딩 -->
  <script type="module" src="./main.js"></script>

</body>
</html>
